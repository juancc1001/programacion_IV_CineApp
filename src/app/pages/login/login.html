<div class="login-backdrop" (click)="close()">
    <div class="login-container" (click)="$event.stopPropagation()">
        <button type="button" class="close-btn" (click)="close()">&times;</button>
        <h2 style="font-weight: bold;">LOGIN</h2>
        <p>Ingrese su información para iniciar sesión</p>
        <form class="form" (ngSubmit)="onSubmit()">
            <app-input placeholder="Email" type="email" [formControl]="email" />
            <app-input placeholder="Contraseña" type="password" [formControl]="password" name="password" />
            <app-button type="submit">INGRESAR</app-button>
        </form>
        <button type="button" class="toggle-btn" (click)="toggleMode()">
            ¿No tenés cuenta? Registrate
        </button>
    </div>
</div>
